<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta name="theme-color" content="#090909" />

    <!-- SEO -->
    <title>Alphira Capital | Trading, Investment & Market Education</title>

    <meta
      name="description"
      content="Alphira Capital is a trading and investment platform providing market education, trading knowledge, and professional insights to help individuals understand and navigate financial markets."
    />

    <meta
      name="keywords"
      content="Alphira Capital, trading, investment, stock market, trading education, financial markets, stock market education, trading academy, investment education"
    />

    <meta name="author" content="Alphira Capital" />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="https://alphiracapital.com/"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/forex.png"
    />

    <link
      rel="apple-touch-icon"
      href="/forex.png"
    />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Alphira Capital | Trading, Investment & Market Education"
    />

    <meta
      property="og:description"
      content="Explore trading, investment, and financial market education with Alphira Capital."
    />

    <meta
      property="og:url"
      content="https://alphiracapital.com/"
    />

    <meta
      property="og:site_name"
      content="Alphira Capital"
    />

    <meta
      property="og:image"
      content="https://alphiracapital.com/forex.png"
    />

    <meta
      property="og:image:alt"
      content="Alphira Capital"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Alphira Capital | Trading, Investment & Market Education"
    />

    <meta
      name="twitter:description"
      content="Explore trading, investment, and financial market education with Alphira Capital."
    />

    <meta
      name="twitter:image"
      content="https://alphiracapital.com/forex.png"
    />

    <!-- Website structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Alphira Capital",
        "url": "https://alphiracapital.com/",
        "logo": "https://alphiracapital.com/forex.png",
        "description": "Alphira Capital is a trading and investment platform providing market education and financial market insights."
      }
    </script>

    <!-- Razorpay -->
    <script
      src="https://checkout.razorpay.com/v1/checkout.js"
    ></script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
